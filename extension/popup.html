<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>发送岗位到简历工坊</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
        font-size: 13px;
        color: #27272a;
        background: #faf9f7;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .hint {
        margin: 4px 0 0;
        font-size: 11.5px;
        line-height: 1.6;
        color: #71717a;
      }
      .hint[data-tone="ok"] {
        color: #047857;
      }
      .hint[data-tone="error"] {
        color: #b91c1c;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        color: #52525b;
      }
      input,
      textarea {
        width: 100%;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.6;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid #e4e4e7;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #18181b;
        border-color: #18181b;
        color: #fff;
      }
      button.ghost {
        background: transparent;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      details {
        margin-top: 12px;
        font-size: 11.5px;
        color: #71717a;
      }
      details input {
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>发送岗位到简历工坊</h1>
    <p class="hint" id="status">正在读取当前页面…</p>

    <label>公司<input id="company" placeholder="可留空" /></label>
    <label>岗位<input id="role" placeholder="可留空" /></label>
    <label>JD<textarea id="jd" placeholder="没抓到就粘在这里"></textarea></label>

    <div class="row">
      <button class="primary" id="send">发送到简历工坊</button>
      <button id="copy">复制 JD</button>
    </div>
    <div class="row">
      <button class="ghost" id="rescan">重新抓取</button>
    </div>
    <div class="row">
      <button id="fill">填充当前页表单</button>
    </div>
    <p class="hint">
      填表只写姓名 / 联系方式等文本字段，不提交、不碰身份证与密码；简历附件请手动上传。
    </p>

    <details>
      <summary>应用地址</summary>
      <div class="row">
        <input id="appUrl" placeholder="http://localhost:3000" />
        <button class="ghost" id="saveUrl">保存</button>
      </div>
    </details>

    <p class="hint" id="result"></p>
    <script src="popup.js"></script>
  </body>
</html>
