name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Browser QA
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm run start > /tmp/next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "Next.js did not start:"
            cat /tmp/next.log
            exit 1
          fi
          npm run qa

      - name: Upload QA screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: .screenshots
          if-no-files-found: ignore
